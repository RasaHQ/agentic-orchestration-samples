  pattern_session_start:
    description: Flow for starting the conversation
    name: pattern session start
    nlu_trigger:
      - intent: session_start
    steps:
      - action: utter_greet

  pattern_external_agent_processing:
    description: Flow which is triggered when user utters while A2A agent is still processing
    name: pattern_external_agent_processing
    steps:
      - action: utter_agent_busy
