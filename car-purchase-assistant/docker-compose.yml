services:

  # Run Rasa Pro with the inspector.
  agentic_assistant:
    depends_on:
      tracker_store:
        condition: service_started
      tavily_search_mcp_server:
        condition: service_started
      appointment_booking_mcp_server:
        condition: service_started
      car_shopping_a2a_agent_server:
        condition: service_started
    image: europe-west3-docker.pkg.dev/rasa-releases/rasa-pro/rasa-pro:3.17.0rc1
    volumes:
      - .:/app
    command:
      - 'run'
      - '--endpoints'
      - 'endpoints-docker-compose.yml'
      - '--credentials'
      - 'credentials-docker-compose.yml'
      - '--sub-agents'
      - 'sub_agents_docker_compose'
      - '--debug'
    ports:
      - '5005:5005'
    env_file:
      - .env
    environment:
      - LLM_API_HEALTH_CHECK=true
      - LANGFUSE_SECRET_KEY=${LANGFUSE_PRIVATE_KEY}
    user: root

  # Rasa server, to enable API access to tracker etc for troubleshooting
  rasa_server:
    depends_on:
      agentic_assistant:
        condition: service_started
    image: europe-west3-docker.pkg.dev/rasa-releases/rasa-pro/rasa-pro:3.17.0rc1
    volumes:
      - .:/app
    command:
      - 'run'
      - '--enable-api'
      - '--endpoints'
      - 'endpoints-docker-compose.yml'
      - '--credentials'
      - 'credentials-docker-compose.yml'
      - '--sub-agents'
      - 'sub_agents_docker_compose'
      - '--debug'
    ports:
      - '5006:5005'
    env_file:
      - .env
    environment:
      - LLM_API_HEALTH_CHECK=true
      - LANGFUSE_SECRET_KEY=${LANGFUSE_PRIVATE_KEY}
    user: root

  chat_client:
    depends_on:
      agentic_assistant:
        condition: service_started
    image: europe-west3-docker.pkg.dev/rasa-releases/rasa-pro/rasa-pro:3.17.0rc1
    volumes:
      - ../chat-client:/chat-client:ro
    entrypoint:
      - 'python'
    command:
      - '/chat-client/server.py'
    ports:
      - '8282:8282'
    environment:
      - CHAT_CLIENT_HOST=0.0.0.0
      - CHAT_CLIENT_PORT=8282
      - CHAT_CLIENT_PUBLIC_URL=http://chat_client:8282
      - RASA_REST_URL=http://agentic_assistant:5005/webhooks/rest/webhook
      - RASA_CALLBACK_URL=http://agentic_assistant:5005/webhooks/callback/webhook

  tracker_store:
    image: postgres:13-alpine
    container_name: tracker_store
    environment:
      POSTGRES_DB: rasa
      POSTGRES_USER: rasa
      POSTGRES_PASSWORD: rasa
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data

  tavily_search_mcp_server:
    container_name: tavily_search_mcp_server
    build:
      context: ./servers/tavily_search_server
      dockerfile: Dockerfile
    command:
      - 'tavily_search_server.py'
    ports:
      - '8001:8001'
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MOCK_TAVILY_SEARCH=${MOCK_TAVILY_SEARCH}

  appointment_booking_mcp_server:
    container_name: appointment_booking_mcp_server
    build:
      context: ./servers/appointment_booking_server
      dockerfile: Dockerfile
    command:
      - 'appointment_server_http.py'
    ports:
      - '8002:8002'

  car_shopping_a2a_agent_server:
    container_name: car_shopping_A2A_agent_server
    build:
      context: ./servers/car_shopping_server
      dockerfile: Dockerfile
    command:
      - 'car_shopping_server.py'
      - '--host'
      - '0.0.0.0'
    ports:
      - '10002:10002'
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}

volumes:
  db:
    driver: local
