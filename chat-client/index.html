<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rasa Chat Client</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f6f7f9;
        color: #1b1f24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(780px, 100%);
        height: min(860px, calc(100vh - 48px));
        display: grid;
        grid-template-rows: auto 1fr auto;
        border: 1px solid #d7dce2;
        border-radius: 8px;
        background: #ffffff;
        overflow: hidden;
      }

      header {
        display: grid;
        gap: 12px;
        padding: 16px;
        border-bottom: 1px solid #d7dce2;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
      }

      .settings {
        display: grid;
        grid-template-columns: 1fr 180px;
        gap: 12px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        color: #4a5563;
      }

      input,
      textarea,
      select,
      button {
        font: inherit;
      }

      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid #c5ccd5;
        border-radius: 6px;
        padding: 10px 12px;
        background: #ffffff;
        color: #1b1f24;
      }

      .endpoint-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid #c5ccd5;
        border-radius: 6px;
        background: #fbfcfd;
        font-size: 13px;
      }

      .endpoint-panel[hidden] {
        display: none;
      }

      .endpoint-panel code {
        display: block;
        overflow-x: auto;
        white-space: normal;
        overflow-wrap: anywhere;
        color: #1b1f24;
      }

      #messages {
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
        padding: 16px;
        background: #fbfcfd;
      }

      .message {
        max-width: 78%;
        padding: 10px 12px;
        border-radius: 8px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .user {
        align-self: flex-end;
        background: #1f6feb;
        color: #ffffff;
      }

      .bot {
        align-self: flex-start;
        background: #eef1f5;
        color: #1b1f24;
      }

      .system {
        align-self: center;
        max-width: 100%;
        background: transparent;
        color: #6b7280;
        font-size: 13px;
        text-align: center;
      }

      .bot img {
        display: block;
        max-width: 100%;
        margin-top: 8px;
        border-radius: 6px;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .buttons button,
      form button {
        border: 0;
        border-radius: 6px;
        padding: 10px 14px;
        cursor: pointer;
        background: #1b1f24;
        color: #ffffff;
      }

      .buttons button {
        background: #ffffff;
        color: #1b1f24;
        border: 1px solid #c5ccd5;
      }

      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 16px;
        border-top: 1px solid #d7dce2;
      }

      textarea {
        min-height: 44px;
        max-height: 160px;
        resize: vertical;
      }

      @media (max-width: 640px) {
        body {
          padding: 0;
        }

        main {
          height: 100vh;
          border: 0;
          border-radius: 0;
        }

        .settings,
        form {
          grid-template-columns: 1fr;
        }

        .message {
          max-width: 90%;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #0f1216;
          color: #edf1f5;
        }

        main,
        input,
        textarea,
        select {
          background: #151a20;
          color: #edf1f5;
        }

        main,
        header,
        form,
        input,
        textarea,
        select,
        .endpoint-panel {
          border-color: #303843;
        }

        #messages,
        .endpoint-panel {
          background: #11161c;
        }

        label,
        .system {
          color: #a8b3c1;
        }

        .endpoint-panel code,
        .bot {
          color: #edf1f5;
        }

        .bot {
          background: #252d37;
        }

        .buttons button {
          background: #151a20;
          color: #edf1f5;
          border-color: #465160;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Rasa Chat Client</h1>
        <div class="settings">
          <label>
            Sender ID
            <input id="sender" value="test_user" autocomplete="off" />
          </label>
          <label>
            Channel
            <select id="channel">
              <option value="rest">REST</option>
              <option value="callback">Callback</option>
            </select>
          </label>
        </div>
        <div id="callback-panel" class="endpoint-panel" hidden>
          <span>Configure Rasa <code>callback.url</code> as:</span>
          <code id="callback-endpoint">Loading...</code>
        </div>
      </header>

      <section id="messages" aria-live="polite">
        <div id="status-message" class="message system">Connected through REST.</div>
      </section>

      <form id="chat-form">
        <textarea
          id="message"
          name="message"
          placeholder="Type a message..."
          rows="1"
          required
        ></textarea>
        <button type="submit">Send</button>
      </form>
    </main>

    <script>
      const form = document.querySelector("#chat-form");
      const senderInput = document.querySelector("#sender");
      const channelSelect = document.querySelector("#channel");
      const messageInput = document.querySelector("#message");
      const messages = document.querySelector("#messages");
      const statusMessage = document.querySelector("#status-message");
      const callbackPanel = document.querySelector("#callback-panel");
      const callbackEndpoint = document.querySelector("#callback-endpoint");

      let lastCallbackMessageId = 0;
      let callbackPollTimer = null;
      const fallbackCallbackEndpoint = `${window.location.origin}/api/rasa-callback`;
      callbackEndpoint.textContent = fallbackCallbackEndpoint;

      function appendMessage(kind, text) {
        const bubble = document.createElement("div");
        bubble.className = `message ${kind}`;
        bubble.textContent = text;
        messages.appendChild(bubble);
        messages.scrollTop = messages.scrollHeight;
        return bubble;
      }

      function currentSender() {
        return senderInput.value.trim() || "test_user";
      }

      function currentChannel() {
        return channelSelect.value;
      }

      function updateChannelUi() {
        const isCallback = currentChannel() === "callback";
        callbackPanel.hidden = !isCallback;
        statusMessage.textContent = isCallback
          ? "Connected through Callback. Waiting for inbound callback messages."
          : "Connected through REST.";

        if (isCallback) {
          startCallbackPolling();
        } else {
          stopCallbackPolling();
        }
      }

      function startCallbackPolling() {
        if (callbackPollTimer) {
          return;
        }

        pollCallbackMessages();
        callbackPollTimer = window.setInterval(pollCallbackMessages, 1000);
      }

      function stopCallbackPolling() {
        if (!callbackPollTimer) {
          return;
        }

        window.clearInterval(callbackPollTimer);
        callbackPollTimer = null;
      }

      function pollCallbackMessages() {
        const params = new URLSearchParams({
          sender: currentSender(),
          after: String(lastCallbackMessageId),
        });

        fetch(`/api/callback-messages?${params}`)
          .then(async (response) => {
            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || `Callback polling failed with ${response.status}`);
            }
            renderResponses(data.messages || [], false);
          })
          .catch((error) => {
            stopCallbackPolling();
            appendMessage("system", error.message);
          });
      }

      function sendMessage(text) {
        const sender = currentSender();
        const channel = currentChannel();
        appendMessage("user", text);
        messageInput.value = "";
        messageInput.focus();

        return fetch("/api/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sender, message: text, channel }),
        })
          .then(async (response) => {
            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || `Request failed with ${response.status}`);
            }

            if (data.callback) {
              appendMessage("system", "Message sent. Waiting for Rasa callback.");
              return;
            }

            renderResponses(data.responses || [], true);
          })
          .catch((error) => {
            appendMessage("system", error.message);
          });
      }

      function renderResponses(responses, showEmpty) {
        if (responses.length === 0) {
          if (showEmpty) {
            appendMessage("system", "Rasa returned no response.");
          }
          return;
        }

        responses.forEach((response) => {
          if (typeof response.id === "number") {
            lastCallbackMessageId = Math.max(lastCallbackMessageId, response.id);
          }

          const text = response.text || JSON.stringify(response, null, 2);
          const bubble = appendMessage("bot", text);

          if (response.image) {
            const image = document.createElement("img");
            image.src = response.image;
            image.alt = "";
            bubble.appendChild(image);
          }

          if (Array.isArray(response.buttons) && response.buttons.length > 0) {
            const buttons = document.createElement("div");
            buttons.className = "buttons";
            response.buttons.forEach((button) => {
              const option = document.createElement("button");
              option.type = "button";
              option.textContent = button.title || button.payload;
              option.addEventListener("click", () => {
                sendMessage(button.payload || button.title);
              });
              buttons.appendChild(option);
            });
            bubble.appendChild(buttons);
          }
        });
      }

      fetch("/api/config")
        .then(async (response) => {
          const config = await response.json();
          if (!response.ok) {
            throw new Error(config.error || `Config request failed with ${response.status}`);
          }
          return config;
        })
        .then((config) => {
          callbackEndpoint.textContent = config.callback_endpoint || fallbackCallbackEndpoint;
        })
        .catch((error) => {
          callbackEndpoint.textContent = fallbackCallbackEndpoint;
          appendMessage("system", `Using inferred callback URL. ${error.message}`);
        });

      channelSelect.addEventListener("change", updateChannelUi);
      senderInput.addEventListener("change", () => {
        lastCallbackMessageId = 0;
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = messageInput.value.trim();
        if (text) {
          sendMessage(text);
        }
      });

      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      updateChannelUi();
    </script>
  </body>
</html>
